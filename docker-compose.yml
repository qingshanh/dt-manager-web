services:
  backend:
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    stop_signal: SIGTERM
    stop_grace_period: 20s
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${DOCKER_NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      DT_ALLOW_APP_FALLBACK: "false"
      PORT: ${BACKEND_INTERNAL_PORT:-5174}
      APP_VERSION: ${APP_VERSION:-0.2.12}
      DATABASE_URL: file:/app/data/dingtone.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - backend-data:/app/data
    ports:
      - "${BACKEND_PORT:-5174}:${BACKEND_INTERNAL_PORT:-5174}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BACKEND_INTERNAL_PORT:-5174}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: unless-stopped
    init: true
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    stop_grace_period: 10s
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${DOCKER_NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${DOCKER_NGINX_IMAGE:-nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        APP_VERSION: ${APP_VERSION:-0.2.12}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.2.12}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:-5174}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  helper:
    restart: unless-stopped
    init: true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    stop_signal: SIGTERM
    stop_grace_period: 20s
    profiles:
      - real
    build:
      context: ./backend/helper
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${DOCKER_NODE_IMAGE:-node:22-alpine}
        PYTHON_IMAGE: ${DOCKER_PYTHON_IMAGE:-python:3.11-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      # 容器内需监听所有接口才能接收 Docker 端口转发；宿主机发布仍仅限下方 127.0.0.1。
      DT_HELPER_BIND_HOST: 0.0.0.0
      DT_HELPER_PORT: ${HELPER_PORT:-5175}
      DT_HELPER_DEVICE_MODE: ${DT_HELPER_DEVICE_MODE:-remote}
      DT_HELPER_REMOTE_HOST: ${DT_HELPER_REMOTE_HOST:-host.docker.internal:27042}
      DT_HELPER_DEVICE_ID: ${DT_HELPER_DEVICE_ID:-}
      DT_HELPER_TOKEN: ${DT_HELPER_TOKEN:-}
      DT_HELPER_DINGTONE_PACKAGE: ${DT_HELPER_DINGTONE_PACKAGE:-me.talkyou.app.im}
      DT_HELPER_DINGDONG_PACKAGE: ${DT_HELPER_DINGDONG_PACKAGE:-me.dingtone.app.im}
      DT_HELPER_TIMEOUT_MS: ${DT_HELPER_TIMEOUT_MS:-90000}
      DT_HELPER_SPAWN_PAUSE_MS: ${DT_HELPER_SPAWN_PAUSE_MS:-1500}
    ports:
      - "127.0.0.1:${HELPER_PORT:-5175}:${HELPER_PORT:-5175}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-data:
